name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript-syntax-check:
    name: JavaScript Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          mapfile -t js_files < <(git ls-files '*.js')

          if [[ ${#js_files[@]} -eq 0 ]]; then
            echo "No JavaScript files found."
            exit 0
          fi

          for file in "${js_files[@]}"; do
            echo "Checking syntax: ${file}"
            node --check "${file}"
          done

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start Azurite
        run: |
          docker run -d --name azurite \
            -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite:latest \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore BillDrift.slnx

      - name: Verify formatting
        run: dotnet format BillDrift.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build solution
        run: dotnet build BillDrift.slnx --no-restore

      - name: Trust ASP.NET HTTPS development certificate
        env:
          SSL_CERT_DIR: ${{ env.HOME }}/.aspnet/dev-certs/trust:/etc/ssl/certs
        run: dotnet dev-certs https --trust

      - name: Run tests
        env:
          SSL_CERT_DIR: ${{ env.HOME }}/.aspnet/dev-certs/trust:/etc/ssl/certs
        run: dotnet test BillDrift.slnx --no-build --verbosity normal
