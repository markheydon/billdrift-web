version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon
    ignore:
      # Microsoft.OpenApi 3.x is not compatible with ASP.NET Core 10; stay on 2.x until a future ASP.NET release.
      - dependency-name: Microsoft.OpenApi
        update-types:
          - version-update:semver-major
    groups:
      tests:
        patterns:
          - xunit
          - NSubstitute
          - Microsoft.NET.Test.Sdk
          - coverlet
        update-types:
          - minor
          - patch

      microsoft-extensions:
        patterns:
          - "^Microsoft\\.Extensions\\."
        update-types:
          - minor
          - patch

      azure:
        patterns:
          - "^Azure\\."
          - "^Microsoft\\.Azure\\."
          - "^Aspire\\."
        update-types:
          - minor
          - patch

      opentelemetry:
        patterns:
          - "^OpenTelemetry"
        update-types:
          - minor
          - patch

      analyzers:
        patterns:
          - Analyzer$
          - Analyzers$
          - "^Microsoft\\.CodeAnalysis"
        update-types:
          - minor
          - patch

      minor-and-patch:
        patterns:
          - ".*"
        update-types:
          - minor
          - patch
